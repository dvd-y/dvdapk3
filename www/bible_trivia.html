  :root {
    --matrix-green: #0b5f7a;
    --matrix-dark: #b9cbdc;
    --matrix-glow: rgba(0,152,184,0.28);
    --bg: #eef3f8;
    --surface: #ffffff;
    --surface2: #f6f9fc;
    --border: rgba(0,120,160,0.28);
    --text: #000000;
    --text-muted: #1c2530;
    --user-bubble: #e3f3f8;
    --ai-bubble: #ffffff;
    --accent: #0b5f7a;
    --correct: #0a6b34;
    --wrong: #b3202a;
    --input-bg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Heebo', sans-serif; background-color: var(--bg); background-image: linear-gradient(rgba(0,152,184,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,152,184,0.04) 1px,transparent 1px); background-size:48px 48px; color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: rgba(255,255,255,0.94); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); flex-shrink: 0; }
  .header-logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #00b4d8, #1d4ed8); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: calc(18px * var(--fs-scale)); color:#fff; box-shadow: 0 2px 10px var(--matrix-glow); }
  @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 16px var(--matrix-glow); } 50% { box-shadow: 0 0 32px var(--matrix-green), 0 0 8px var(--matrix-green); } }
  .logo-text { font-size: calc(18px * var(--fs-scale)); font-weight: 700; color: var(--matrix-green); text-shadow: 0 0 10px var(--matrix-glow); letter-spacing: 0.5px; }
  .logo-sub { font-size: max(1rem, calc(11px * var(--fs-scale))); color: var(--text-muted); font-family: 'Share Tech Mono', monospace; }
  .header-stats { display: flex; gap: 16px; align-items: center; }
  .stat-badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: max(1rem, calc(12px * var(--fs-scale))); color: var(--text-muted); font-family: 'Share Tech Mono', monospace; }
  .stat-badge span { color: var(--matrix-green); font-weight: 700; }
  .category-bar { display: flex; gap: 8px; padding: 10px 16px; background: rgba(255,255,255,0.94); border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; scrollbar-width: thin; scrollbar-color: var(--matrix-dark) transparent; }
  .cat-btn { flex-shrink: 0; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); font-family: 'Heebo', sans-serif; font-size: max(1rem, calc(13px * var(--fs-scale))); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .cat-btn:hover { border-color: var(--matrix-green); color: var(--matrix-green); background: rgba(0,152,184,0.05); }
  .cat-btn.active { border-color: var(--matrix-green); background: rgba(0,152,184,0.12); color: var(--matrix-green); box-shadow: 0 0 8px var(--matrix-glow); }
  .chat-area { flex: 1; overflow-y: auto; padding: 20px 16px; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--matrix-dark) transparent; }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--matrix-dark); border-radius: 4px; }
  .msg-row { display: flex; margin-bottom: 16px; animation: fadeUp 0.4s ease; max-width: 780px; margin-left: auto; margin-right: auto; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.ai { justify-content: flex-start; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: calc(16px * var(--fs-scale)); margin-left: 10px; }
  .avatar.ai-avatar { background: linear-gradient(135deg, #d9f1f7, #b6e0ec); border: 1px solid var(--matrix-green); }
  .avatar.user-avatar { background: #e7eef7; border: 1px solid #b9cbdc; order: 1; margin-left: 0; margin-right: 10px; }
  .bubble { max-width: 75%; padding: 14px 18px; border-radius: 18px; font-size: max(1rem, calc(15px * var(--fs-scale))); line-height: 1.6; }
  .bubble.ai-bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-right-radius: 4px; color: var(--text); }
  .bubble.user-bubble { background: var(--user-bubble); border: 1px solid rgba(0,152,184,0.3); border-top-left-radius: 4px; color: var(--matrix-green); }
  .question-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-top: 10px; }
  .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .q-num { font-family: 'Share Tech Mono', monospace; font-size: max(1rem, calc(12px * var(--fs-scale))); color: var(--text-muted); }
  .q-category { font-size: max(1rem, calc(11px * var(--fs-scale))); background: rgba(0,152,184,0.1); border: 1px solid rgba(0,152,184,0.3); color: var(--matrix-green); padding: 2px 10px; border-radius: 10px; }
  .q-text { font-size: calc(16px * var(--fs-scale)); font-weight: 500; color: var(--text); margin-bottom: 18px; line-height: 1.7; }
  .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt-btn { padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,40,70,0.03); color: var(--text); font-family: 'Heebo', sans-serif; font-size: max(1rem, calc(14px * var(--fs-scale))); cursor: pointer; text-align: right; transition: all 0.2s; line-height: 1.4; }
  .opt-btn:hover:not(:disabled) { border-color: var(--matrix-green); background: rgba(0,152,184,0.07); color: var(--matrix-green); transform: translateY(-1px); }
  .opt-btn.correct { border-color: var(--correct); background: rgba(10,122,59,0.12); color: var(--correct); animation: correctFlash 0.5s ease; }
  .opt-btn.wrong { border-color: var(--wrong); background: rgba(192,38,45,0.1); color: var(--wrong); }
  @keyframes correctFlash { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
  .result-msg { margin-top: 12px; padding: 12px 16px; border-radius: 12px; font-size: max(1rem, calc(14px * var(--fs-scale))); line-height: 1.6; }
  .result-msg.correct-r { background: rgba(10,122,59,0.08); border: 1px solid rgba(10,122,59,0.3); color: var(--correct); }
  .result-msg.wrong-r { background: rgba(192,38,45,0.08); border: 1px solid rgba(192,38,45,0.3); color: #b3202a; }
  .input-area { background: rgba(255,255,255,0.94); border-top: 1px solid var(--border); padding: 12px 16px 16px; flex-shrink: 0; backdrop-filter: blur(12px); }
  .input-inner { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 10px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 26px; padding: 8px 8px 8px 16px; transition: border-color 0.2s; }
  .input-inner:focus-within { border-color: rgba(0,152,184,0.4); box-shadow: 0 0 12px rgba(0,152,184,0.08); }
  .chat-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-family: 'Heebo', sans-serif; font-size: max(1rem, calc(15px * var(--fs-scale))); direction: rtl; }
  .chat-input::placeholder { color: #3a4654; }
  .send-btn { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--matrix-green); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s; font-size: calc(16px * var(--fs-scale)); }
  .send-btn:hover { background: #08485d; box-shadow: 0 0 12px var(--matrix-glow); transform: scale(1.05); }
  .next-btn { margin-top: 14px; padding: 10px 24px; border-radius: 22px; border: 1px solid var(--matrix-green); background: rgba(0,152,184,0.08); color: var(--matrix-green); font-family: 'Heebo', sans-serif; font-size: max(1rem, calc(14px * var(--fs-scale))); font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
  .next-btn:hover { background: rgba(0,152,184,0.18); box-shadow: 0 0 12px var(--matrix-glow); }
  .score-card { background: var(--surface2); border: 1px solid var(--matrix-green); border-radius: 20px; padding: 28px; text-align: center; box-shadow: 0 0 30px rgba(0,152,184,0.12); }
  .score-title { font-size: calc(22px * var(--fs-scale)); font-weight: 700; color: var(--matrix-green); margin-bottom: 8px; text-shadow: 0 0 10px var(--matrix-glow); }
  .score-num { font-family: 'Share Tech Mono', monospace; font-size: calc(52px * var(--fs-lg)); color: var(--matrix-green); line-height: 1; margin: 12px 0; text-shadow: 0 0 20px var(--matrix-glow); }
  .score-sub { font-size: max(1rem, calc(14px * var(--fs-scale))); color: var(--text-muted); margin-bottom: 20px; }

  .typing { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--matrix-green); animation: typing-dot 1.2s ease-in-out infinite; opacity: 0.4; }

  .footer { text-align: center; font-size: max(1rem, calc(11px * var(--fs-scale))); color: #3a4654; padding: 6px 0 10px; font-family: 'Share Tech Mono', monospace; flex-shrink: 0; background: rgba(255,255,255,0.94); }
  @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } .bubble { max-width: 90%; } .stat-badge { display: none; } }

  {q:"כמה בגדים לבש הכהן הגדול ביום כיפור בשרת במקדש?",opts:["3","4","5","8"],ans:1,cat:"yom_kipur",ref:"ויקרא טז"},
  // PURIM
  {q:"מי כתב מגילת אסתר?",opts:["אסתר ומרדכי","שלמה","עזרא","אליהו"],ans:0,cat:"purim",ref:"אסתר ט"},
  {q:"מי היה המן?",opts:["שר המלך אחשורוש","נביא","כהן גדול","מלך"],ans:0,cat:"purim",ref:"אסתר ג"},
  {q:"על עץ כמה אמות נתלה המן?",opts:["20","30","50","60"],ans:2,cat:"purim",ref:"אסתר ז"},
  {q:"כמה בנים היו למן?",opts:["5","7","10","12"],ans:2,cat:"purim",ref:"אסתר ט"},
  {q:"מה שם מלך פרס בסיפור אסתר?",opts:["כורש","דריווש","אחשורוש","בלשאצר"],ans:2,cat:"purim",ref:"אסתר א"},
  {q:"כמה ימים צמה אסתר לפני שנכנסה למלך?",opts:["1","2","3","7"],ans:2,cat:"purim",ref:"אסתר ד"},
  {q:"מה שם עיר הבירה של אחשורוש?",opts:["בבל","שושן","ירושלים","ניניווה"],ans:1,cat:"purim",ref:"אסתר א"},
  {q:"כמה כוסות שגנות עשה מלך אחשורוש בסעודתו?",opts:["120","180","220","360"],ans:1,cat:"purim",ref:"אסתר א"},
  // CHANUKA
  {q:"כמה ימים חוגגים חנוכה?",opts:["6","7","8","9"],ans:2,cat:"chanuka",ref:"מגילת תענית"},
  {q:"מה הנס שקרה עם השמן בחנוכה?",opts:["שמן ליום אחד דלק 8 ימים","שמן ל-8 ימים נגמר ביום","שמן לא נגמר לעולם","שמן יצא מהסלע"],ans:0,cat:"chanuka",ref:"שבת כא"},
  {q:"מי היו המכבים?",opts:["כהנים בני מתתיהו","לוחמי ישראל","נביאים","מלכים"],ans:0,cat:"chanuka",ref:"ספר מכבים"},
  {q:"מה שם אבא של יהודה המכבי?",opts:["יוחנן","שמעון","מתתיהו","אלעזר"],ans:2,cat:"chanuka",ref:"ספר מכבים"},
  {q:"כמה נרות מדליקים בלילה האחרון עם השמש?",opts:["6","7","8","9"],ans:3,cat:"chanuka",ref:"הלכות חנוכה"},
  {q:"באיזה חודש חוגגים חנוכה?",opts:["תשרי","כסלו-טבת","ניסן","אדר"],ans:1,cat:"chanuka",ref:"מגילת תענית"},
  {q:"מה שם הכד הקטן שמצאו המכבים?",opts:["כד שמן","כד מים","כד יין","כד דם"],ans:0,cat:"chanuka",ref:"שבת כא"},
];

// STATE
let currentCategory = 'all';
let sessionQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let gameStarted = false;

const catNames = {all:'הכל',torah:'תורה',neviim:'נביאים',ketuvim:'כתובים',pesach:'פסח',shavuot:'שבועות',sukkot:'סוכות',rosh_hashana:'ראש השנה',yom_kipur:'יום כיפור',purim:'פורים',chanuka:'חנוכה'};
const catEmojis = {all:'🕍',torah:'📜',neviim:'🔥',ketuvim:'📖',pesach:'🍷',shavuot:'🌾',sukkot:'🌿',rosh_hashana:'🍎',yom_kipur:'🕊️',purim:'🎭',chanuka:'🕎'};

function selectCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  sessionQuestions = []; currentIndex = 0; score = 0; answered = false; gameStarted = false;
  updateStats();
  clearChat();
  addAiMsg('קטגוריה שונה ל<strong>' + (catEmojis[cat]||'') + ' ' + (catNames[cat]||cat) + '</strong>. הקלד <strong>התחל</strong> כדי להתחיל!');
}

function getFiltered() {
  if (currentCategory === 'all') return [...allQuestions];
  return allQuestions.filter(q => q.cat === currentCategory);
}

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// CHAT
function clearChat() { document.getElementById('chat-area').innerHTML = ''; }

function addAiMsg(html, extraHtml) {
  const area = document.getElementById('chat-area');
  const row = document.createElement('div');
  row.className = 'msg-row ai';
  row.innerHTML = '<div class="avatar ai-avatar">✡</div><div class="bubble ai-bubble"><div>'+html+'</div>'+(extraHtml||'')+'</div>';
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function addUserMsg(text) {
  const area = document.getElementById('chat-area');
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = '<div class="bubble user-bubble">'+text+'</div><div class="avatar user-avatar">👤</div>';
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('chat-area');
  const row = document.createElement('div');
  row.className = 'msg-row ai'; row.id = 'typing-indicator';
  row.innerHTML = '<div class="avatar ai-avatar">✡</div><div class="bubble ai-bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  area.appendChild(row);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() { const t=document.getElementById('typing-indicator'); if(t) t.remove(); }

// GAME
function startGame() {
  let pool = getFiltered();
  if (!pool.length) { addAiMsg('אין שאלות בקטגוריה זו. בחר קטגוריה אחרת.'); return; }
  sessionQuestions = shuffle(pool).slice(0, Math.min(100, pool.length));
  currentIndex = 0; score = 0; answered = false; gameStarted = true;
  updateStats();
  showTyping();
  setTimeout(() => { removeTyping(); showNextQuestion(); }, 700);
}

function showNextQuestion() {
  if (currentIndex >= sessionQuestions.length) { showFinalScore(); return; }
  answered = false;
  const q = sessionQuestions[currentIndex];
  const card = buildCard(q, currentIndex);
  showTyping();
  setTimeout(() => { removeTyping(); addAiMsg('שאלה מספר '+(currentIndex+1)+' מתוך '+sessionQuestions.length+':', card); }, 600);
}

function buildCard(q, idx) {
  const label = (catEmojis[q.cat]||'') + ' ' + (catNames[q.cat]||q.cat);
  const opts = q.opts.map((o,i)=>'<button class="opt-btn" id="opt-'+idx+'-'+i+'" onclick="selectAnswer('+idx+','+i+')">'+['א','ב','ג','ד'][i]+'. '+o+'</button>').join('');
  return '<div class="question-card" id="qcard-'+idx+'">'
    +'<div class="q-meta"><span class="q-num">📍 '+q.ref+'</span><span class="q-category">'+label+'</span></div>'
    +'<div class="q-text">'+q.q+'</div>'
    +'<div class="options-grid">'+opts+'</div>'
    +'<div id="result-'+idx+'"></div>'
    +'</div>';
}

function selectAnswer(idx, chosen) {
  if (answered) return;
  answered = true;
  const q = sessionQuestions[idx];
  const correct = q.ans;
  const isCorrect = chosen === correct;
  for (let i=0;i<q.opts.length;i++) {
    const btn = document.getElementById('opt-'+idx+'-'+i);
    if (btn) { btn.disabled=true; if(i===correct) btn.classList.add('correct'); else if(i===chosen&&!isCorrect) btn.classList.add('wrong'); }
  }
  if (isCorrect) score++;
  updateStats();
  const rd = document.getElementById('result-'+idx);
  if (rd) {
    const resHtml = isCorrect
      ? '<div class="result-msg correct-r">✅ <strong>נכון מאוד!</strong> "'+q.opts[correct]+'" — '+q.ref+'</div>'
      : '<div class="result-msg wrong-r">❌ לא נכון. התשובה הנכונה: <strong>"'+q.opts[correct]+'"</strong> — '+q.ref+'</div>';
    rd.innerHTML = resHtml + '<button class="next-btn" onclick="nextQuestion()">שאלה הבאה ›</button>';
  }
  document.getElementById('chat-area').scrollTop = 99999;
}

function nextQuestion() {
  currentIndex++;
  updateStats();
  showNextQuestion();
}

function showFinalScore() {
  const pct = Math.round((score/sessionQuestions.length)*100);
  const emoji = pct>=80?'🏆':pct>=60?'⭐':pct>=40?'📚':'💪';
  const msg = pct>=80?'מצוין! אתה מומחה תנ"ך!':pct>=60?'כל הכבוד! ידע טוב!':pct>=40?'לא רע, המשך ללמוד!':'כדאי לחזור על החומר!';
  const card = '<div class="score-card">'
    +'<div class="score-title">'+emoji+' סיימת את הטריוויה!</div>'
    +'<div class="score-num">'+score+'/'+sessionQuestions.length+'</div>'
    +'<div class="score-sub">'+pct+'% • '+msg+'</div>'
    +'<button class="restart-btn" onclick="restartGame()">🔄 שחק שוב</button>'
    +'</div>';
  showTyping();
  setTimeout(() => { removeTyping(); addAiMsg('', card); }, 800);
}

function restartGame() { clearChat(); startGame(); }

function updateStats() {
  document.getElementById('q-counter').textContent = gameStarted ? currentIndex : '0';
  document.getElementById('score-display').textContent = score;
}

// INPUT
function handleKey(e) { if(e.key==='Enter') { e.preventDefault(); sendMessage(); } }

function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addUserMsg(text);
  const lower = text.toLowerCase();
  if (lower.includes('התחל') || lower.includes('start') || lower.includes('חדש') || lower.includes('שחק') || lower.includes('המשך')) {
    showTyping(); setTimeout(() => { removeTyping(); startGame(); }, 400);
  } else if (lower.includes('ניקוד') || lower.includes('score')) {
    addAiMsg('📊 הניקוד שלך: <strong>'+score+'</strong> נכונות מתוך <strong>'+currentIndex+'</strong> שאלות.');
  } else if (lower.includes('עזרה') || lower.includes('help')) {
    addAiMsg('ℹ️ <strong>הוראות:</strong><br>• הקלד <strong>"התחל"</strong> לשאלה חדשה<br>• בחר קטגוריה בסרגל למעלה<br>• לחץ על תשובה שנראית נכונה<br>• הניקוד מתעדכן אוטומטית');
  } else {
    addAiMsg('הקלד <strong>"התחל"</strong> להתחלת משחק, או לחץ על תשובה בשאלה.');
  }
}

// INIT
window.addEventListener('load', () => {
  addAiMsg('שלום! ברוך הבא לטריוויה התנ"ך! 🕍<br><br>'
    +'יש לנו <strong>'+allQuestions.length+' שאלות</strong> מכל חלקי התנ"ך, כולל שאלות על כל החגים.<br><br>'
    +'בחר קטגוריה בסרגל למעלה, ואז הקלד <strong>"התחל"</strong> להתחלת המשחק!');
});
