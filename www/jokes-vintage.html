        :root{
            --wood-dark:#3a2415;
            --wood-mid:#5c3a22;
            --wood-light:#8a5a34;
            --paper:#f2e2c4;
            --paper-dark:#e6d0a3;
            --ink:#3a2415;
            --gold:#c99a3c;
            --gold-light:#e0b96a;
        }
        *{ box-sizing: border-box; }
        html,body{ height:100%; }
        body {
            font-family: 'Frank Ruhl Libre', serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(ellipse at top left, rgba(255,255,255,0.05), transparent 60%),
                repeating-linear-gradient(90deg, var(--wood-dark) 0px, var(--wood-mid) 3px, var(--wood-dark) 6px, var(--wood-mid) 40px, var(--wood-dark) 44px, var(--wood-mid) 90px),
                linear-gradient(180deg, #4a2f1c, #2c1a0e);
            background-blend-mode: overlay, normal, normal;
            position: relative;
        }
        body::before{
            content:"";
            position:fixed;
            inset:0;
            background-image:
                repeating-radial-gradient(ellipse at 20% 30%, rgba(0,0,0,0.15) 0px, transparent 2px),
                repeating-radial-gradient(ellipse at 70% 60%, rgba(0,0,0,0.12) 0px, transparent 3px);
            pointer-events:none;
            opacity:0.5;
        }

        .frame {
            position: relative;
            max-width: 680px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(160deg, var(--wood-light), var(--wood-dark) 60%, #2a1a0d);
            border-radius: 18px;
            box-shadow:
                0 0 0 2px rgba(0,0,0,0.4),
                0 25px 50px rgba(0,0,0,0.55),
                inset 0 2px 4px rgba(255,255,255,0.15),
                inset 0 -6px 12px rgba(0,0,0,0.5);
        }
        .frame::before{
            content:"❦";
            position:absolute;
            top:-16px; left:50%;
            transform: translateX(-50%);
            font-size: calc(30px * var(--fs-lg));
            color: var(--gold);
            background: var(--wood-dark);
            width:40px; height:40px;
            border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            box-shadow: 0 0 0 3px var(--gold), 0 4px 10px rgba(0,0,0,0.5);
        }

        .container {
            background:
                radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.5), transparent 55%),
                linear-gradient(160deg, var(--paper), var(--paper-dark));
            border: 3px solid var(--gold);
            border-radius: 10px;
            padding: 40px 32px 34px;
            text-align: center;
            position: relative;
            box-shadow:
                inset 0 0 0 1px rgba(90,58,34,0.4),
                inset 0 0 40px rgba(90,58,34,0.25);
            overflow:hidden;
        }
        .container::after{
            content:"";
            position:absolute; inset:8px;
            border: 1px solid rgba(90,58,34,0.35);
            border-radius: 6px;
            pointer-events:none;
        }

        .corner{
            position:absolute;
            width:34px; height:34px;
            border: 2px solid var(--gold);
            opacity:0.85;
        }
        .corner.tl{ top:6px; left:6px; border-right:none; border-bottom:none; border-radius:6px 0 0 0;}
        .corner.tr{ top:6px; right:6px; border-left:none; border-bottom:none; border-radius:0 6px 0 0;}
        .corner.bl{ bottom:6px; left:6px; border-right:none; border-top:none; border-radius:0 0 0 6px;}
        .corner.br{ bottom:6px; right:6px; border-left:none; border-top:none; border-radius:0 0 6px 0;}

        h1 {
            font-family: 'Frank Ruhl Libre', serif;
            font-weight: 900;
            color: var(--wood-dark);
            font-size: calc(2.1rem * var(--fs-lg));
            margin: 0 0 6px;
            letter-spacing: 1px;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5), 2px 2px 3px rgba(90,58,34,0.3);
        }
        .subtitle{
            color: var(--wood-mid);
            font-size: max(1rem, calc(0.95rem * var(--fs-scale)));
            margin: 0 0 22px;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        .divider{
            width: 140px;
            height: 3px;
            margin: 0 auto 26px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            position: relative;
        }
        .divider::before{
            content:"✦";
            position:absolute;
            top:50%; left:50%;
            transform: translate(-50%,-50%);
            background: var(--paper);
            color: var(--gold);
            padding: 0 8px;
            font-size: calc(1rem * var(--fs-scale));
        }

        .joke-box {
            font-size: calc(1.25rem * var(--fs-scale));
            color: var(--ink);
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 26px;
            padding: 26px 24px;
            border: 2px solid rgba(90,58,34,0.35);
            border-radius: 8px;
            background:
                linear-gradient(160deg, rgba(255,255,255,0.4), transparent 40%),
                var(--paper-dark);
            line-height: 1.7;
            box-shadow: inset 0 2px 8px rgba(90,58,34,0.25);
            font-weight: 500;
            transition: opacity 0.25s ease;
        }
        .joke-box.quote::before{ content:"“"; }
        .joke-box.quote::after{ content:"”"; }

        .btn-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            font-family: 'Frank Ruhl Libre', serif;
            background: linear-gradient(160deg, var(--wood-light), var(--wood-mid));
            color: var(--paper);
            border: 2px solid var(--gold);
            padding: 13px 30px;
            font-size: calc(1.05rem * var(--fs-scale));
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 6px 12px rgba(0,0,0,0.3);
            transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s ease;
        }
        button:hover {
            background: linear-gradient(160deg, var(--gold-light), var(--gold));
            color: var(--wood-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 0 rgba(0,0,0,0.35), 0 10px 16px rgba(0,0,0,0.35);
        }
        button:active{
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 3px 6px rgba(0,0,0,0.3);
        }
        #installBtn {
            background: linear-gradient(160deg, #4f6b3a, #33471f);
            display: none;
        }
        #installBtn:hover {
            background: linear-gradient(160deg, #7ea35c, #4f6b3a);
        }

        @media (max-width: 480px){
            h1{ font-size: calc(1.6rem * var(--fs-scale)); }
            .container{ padding: 30px 18px 26px; }
            .joke-box{ font-size: calc(1.05rem * var(--fs-scale)); padding: 20px 14px; }
        }

            "אמא: 'שימי, למה אתה אוכל עם הידיים?!'. שימי: 'כי אני לא רוצה ללכלך את המזלג.'",
            "אמא: 'דני, למה ציירת על הקיר עם טושים?'. דני: 'כי הנייר לא היה מספיק גדול בשביל הכישרון שלי.'",
            "למדתי גמרא כל הלילה... עד שהתעוררתי מהחלום.",
            "איש אחד אמר לחברו: 'אני נוסע מצוין בכביש'. שאל אותו החבר: 'איך אתה יודע?'. ענה לו האיש: 'אחרת לא היו צופרים לי כל רגע ושואלים אותי מי לימד אותך לנהוג.'",
            "פעם פגשתי קמצן ואמרתי לו: 'שתיקה שווה זהב'. מאז, לא שמעתי ממנו כלום...",
            "שופט פונה לנאשם ואומר לו: 'אתה מואשם בהלבנת הון, הלוואות בשוק האפור ועבודה בשחור. יש לך משהו להגיד להגנתך?'. 'כן' עונה הנאשם, 'כבוד השופט, אני עיוור צבעים.'",
            "אבא לשמוליק: 'שמוליק, שים חגורה.' שמוליק לאבא: 'אבל אבא... לא נופלות לי המכנסיים.'",
            "אמא אחת טסה לחו\"ל והשאירה את בעלה עם הבן שלהם. בבוקר כשלקח האבא את בנו לגן אחד, אמרה לו הגננת: 'הבן שלך לא בגן הזה'. לקח האבא את הילד לגנים אחרים, וגם שם ענו לו הגננות את אותו הדבר, ואז הילד אמר לאבא: 'אבא, אם נלך לעוד גן אחד, אני אאחר לבית הספר.'",
            "אם החיים נותנים לכם לימונים... תעשו מהם הכל... חוץ מוופלים.",
            "גנב אומר לידידו: 'פעם, היית נכנס לחנות עם 10 שקלים, ויוצא עם כל טוב הארץ.' 'והיום?' מסתקרן ידידו. 'היום? היום יש מצלמות אבטחה' מתבאס הגנב.",
            "למה כדורגל תמיד עצוב? כי כל הזמן בועטים בו.",
            "ילדה מדברת בטלפון חצי שעה ומנתקת. שאל אותה אח שלה: 'מה קרה? בדרך כלל את מדברת שעתיים?'. ענתה לו: 'התקשרתי למספר שגוי!'.",
            "איש אחד הלך לבית קברות בלילה כשהוא רועד מפחד, ופתאום הוא פוגש עוד איש... 'איזה נס שאתה פה, אני ממש מפחד להיות פה לבד בלילה'. ענה לו האיש: 'כן, גם כשאני הייתי בחיים פחדתי להיות פה לבד.'",
            "אני חושבת שהגיע הזמן שספר החשבון יפתור את הבעיות שלו בעצמו.",
            "ישנתי בלילה על מטען... יש לי סימן אדום בגב, אבל אני 100 אחוז.",
            "אני אף פעם לא שיקרתי... חוץ מעכשיו.",
            "מנהל החליט לתלות שלט חדש על דלת המשרד שלו כדי להפגין סמכות: 'אני הבוס!'. למחרת הוא מגיע ורואה שמישהו הדביק פתק קטן מתחת לשלט: 'אשתך התקשרה... היא רוצה את השלט שלה בחזרה.'",
            "מתמטיקה יקרה! הגיעה הזמן שתתבגרי ותתחילי לפתור את הבעיות שלך בכוחות עצמך!",
            "אם מישהו הולך בראש מורם... סימן שאין לו טלפון.",
            "פעם חשבתי שאויר זה בחינם, עד שקניתי שקית צ'יפס.",
            "דני: 'שמעון, מה אתה יכול להגיד על הספר הזה?'. שמעון: 'שהוא דק והאותיות גדולות ומסיימים אותו מהר...'.",
            "קמצן אמר לבנו: 'לך תביא מהשכנים פטיש'. הלך הבן ולא מצא אצל השכנים, חזר לאביו וסיפר לו שלא מצא. אמר לו אביו: 'אז תביא את שלנו!'.",
            "הרגע הזה שהמקרר מתנקם בך - פותח ת'דלת של החדר שלך כל כמה דקות, בוהה בך, והולך...",
            "משוגע נכנס לפיצריה ושאל: 'יש לכם פיצה עם אבוקדו?'. ענה לו המוכר: 'לא, אין לנו'. אז התחיל המשוגע לבוא כל יום ובכל פעם ענה לו המוכר שאין להם פיצה עם אבוקדו ושיגיע ביום שישי. הגיע המשוגע ביום שישי ושאל שוב: 'יש לכם פיצה עם אבוקדו?'. ענה לו המוכר בשמחה: 'כן! יש לנו'. אמר לו המשוגע: 'איכס! מי אוכל את זה???'.",
            "הדבר הכי טוב שצריך לעשות בכדי להתחיל את הבוקר עם חיוך זה פשוט לקום בצהרים.",
            "יוסי ודני עשו קומזיץ ביער ולאחר מכן הקימו אוהל והלכו לישון. באמצע הלילה יוסי מעיר את דני ואומר לו: 'תסתכל בשמים, מה אתה רואה?'. דני: 'שמים, עננים כוכבים...'. יוסי: 'ואתה יודע מה זה אומר?'. דני משיב בביטחון: 'כן, זה אומר שאנחנו נמצאים במקום יפה!'. יוסי: 'לא, זה אומר שגנבו לנו את האוהל!'.",
            "אבא אחד שכב בבית חולים. לפני מותו אמר לבנו הבכור: 'יהודה, אתה מקבל את רחוב המכבים'. אמר לבנו השני: 'דוד, אתה מקבל את רחוב אהבת ישראל'. אמר לבנו השלישי: 'שמואל, אתה מקבל את רחוב אבן גבירול'. שאל הרופא: 'במה אביכם עבד שהיה כזה עשיר?'. ענו הבנים: 'מחלק עיתונים.'",
            "פעם אחת היה ילד ליד מעבר חציה. שאל אותו איש: 'רוצה לעבור את הכביש?'. הילד שתק. עוד איש ועוד איש שאלו אותו עד שהילד התחיל לבכות ואמר: 'אני רוצה לעבור את הכביש, אבל אמא לא מרשה לי לדבר עם זרים.'",
            "'אמא תעשי לי פווו.' 'את יכולה לעשות פו בעצמך.' 'אבל אני קטנה... בפווו שלי אין מספיק פווו.'",
            "משה ודני הלכו לבריכה. משה: 'דני, איך המים... קרים?'. דני: 'אחרי 5 דקות מתרגלים'. משה: 'אז אכנס עוד 5 דקות!'.",
            "מה מאחלים לבן אדם שחוגג יום הולדת 120? שיהיה לך יום טוב!",
            "סבתא מנסה ללמד את יעלי חשבון: 'אם אתן לך שתי סוכריות ועוד שלוש, כמה יהיו לך?'. 'לא יודעת, אבל זה יספיק לי, תודה.' עונה יעלי בנימוס.",
            "איש אחד הלך לנהר ופגש דייג. שאל אותו האיש: 'תגיד לי, הנהר עמוק?'. ענה לו הדייג: 'לא'. נכנס האיש לנהר ויוצא כולו רטוב מכף רגל ועד ראש. צעק לדייג: 'אמרת שהנהר לא עמוק...'. 'מה אתה רוצה...', ענה לו הדייג, 'לפני כמה דקות עבר פה ברווז בלי בעיה.'",
            "הרגע הזה שנתקעת לך הזרת ברגל השולחן ואז אתה מתחיל לקפץ ולצעוק כמו אינדיאני.",
            "הרגע הזה בלילה שאתה לא יודע אם השמיכה לאורך או לרוחב ואתה מנסה לסדר אותה עם הידיים והרגליים ואתה נראה כמו חיפושית הפוכה.",
            "סגור את החלון, קר בחוץ! ואם אסגור את החלון יהיה חם בחוץ?",
            "שני קיסמים טיילו, קיסם אחד ראה קיפוד ואמר: 'הנה אוטובוס!'.",
            "דודה: 'יוסי, תאכל הרבה גזר, זה טוב לראייה'. יוסי: 'אבל דודה, זה מלפפון'.",
            "גוי ויהודי התווכחו למי יש יותר חגים. אמר הגוי: 'כל חג שיש לכם - תלוש לי שערה'. היהודי אמר: 'פסח, סוכות, שבועות, פורים, חנוכה ...' והמשיך 'שבת, שבת, שבת...', וכך נגמרו לגוי השערות. אמר לו הגוי: 'ניצחת, אבל עכשיו - כל רב שיש לכם - תלוש לי שערה מהזקן'. ענה לו היהודי: 'רבי עקיבא ו-24 אלף תלמידיו...'.",
            "איש אחד עשה דיאטה והזמין פיצה. הפיצריה שאלה: 'לכמה לחתוך לך ת'פיצה? כדאי לך לשמונה... זה הכי טוב!'. ענה האיש: 'מה פתאום! אני בדיאטה, שיהיה חתיכה אחת!'.",
            "לפעמים בא לי להיות בצק... רק בשביל שיניחו אותי בצד לנוח לכמה שעות...",
            "ילד צייר בית פעם בצד ימין של הדף ופעם בצד השמאלי של הדף. שאלו אותו: 'חמוד, למה אתה לא מצייר את הבית במרכז?'. ענה הילד: 'ברור למה... מי יכול להרשות לעצמו היום בית במרכז?'.",
            "המוח שלי יכול להיזכר פתאום באירוע שקרה לי לפני 10 שנים, אבל לא מסוגל לזכור למה נכנסתי למטבח לפני 10 שניות.",
            "חוק הבורקסים: גבינה זה משולש, תפוח אדמה זה ריבוע, תרד זה לא טעים.",
            "איש אחד הולך למסעדה. המלצר ניגש אליו ואומר לו: 'יש לי כבד קצוץ, רגל קרושה ולשון צלויה.' עונה לו האיש: 'את הבעיות שלך תספר למישהו אחר, אתה יכול להביא לי עוף בגריל?'.",
            "זה הגיוני? אילם סיפר לחירש שעיור ראה חיגר שרץ אחרי קירח ומושך לו בשערות!",
            "דני: 'אבא בוא נטוס לשמש!'. אבא: 'אי אפשר, מאוד מאוד חם שם'. דני: 'אז נטוס אליה בלילה!'.",
            "אני לא עייף, אני רק מנסה להקשיב לשולחן.",
            "ערבי, רוסי, סיני, יפני, תאילנדי וישראלי נכנסו למסעדה... המלצר: 'טוב נו, זה יותר מידי בשביל בדיחה...'.",
            "ילד פתח את המקרר, ראה את הקוטג' וצעק: 'אמא, אני מטעין את הקוטג''. אמא שאלה: 'למה?'. והילד ענה: 'כי יש לו רק 5 אחוז.'",
            "איש אחד אמר לרב שלו: 'אישתי כבר 30 שנה זורקת עלי צלחות!'. ענה לו הרב: 'אז למה רק עכשיו אתה מתלונן?'. ענה האיש: 'כי רק עכשיו היא הצליחה לקלוע.'",
            "איש אחד שאל את אימו מה היא רוצה שהוא יקנה לה בחו\"ל. היא ענתה ששמעה שיש שיקוי פלא שמי ששותה ממנו הופך לצעיר יותר: 'אותו אני רוצה שתקנה לי'. קנה ושלח. כשחזר לביתו, ראה ילדה מחזיקה תינוק: 'מה זה? מי את?'. 'אני אמא שלך, אתה לא זוכר את השיקוי?'. 'ומי זה התינוק?'. 'זה אבא, הוא שתה את כל הבקבוק.'",
            "שכן שלי ממש חוצפן, הוא דופק לי על הדלת ב-2 בלילה... מזל שהייתי באימון תופים...",
            "ילד: 'אמא, בשוקולד יש ויטמינים?'. אמא: 'ממש קצת'. ילד: 'אז אין לי ברירה, אלא לאכול המון שוקולד.'",
            "אבא שלח את בנו לקנות גפרורים. הבן חזר עם חבילה שרופה. אבא: 'למה כל הגפרורים שרופים?'. בן: 'רציתי לבדוק שהם בסדר.'",
            "למי יש 10 רגליים? לחמישה אנשים.",
            "'פעם היה נהוג לצבוע את השיער בצבע לבן'. 'איך אתה יודע?'. 'היום כל הזקנים ככה.'",
            "ביצה א': 'וואוו, איך השתזפת וגם גדלו לך שערות!'. ביצה ב': 'אני קיווי.'",
            "אנשים לא מגיעים לחתונה לשמח חתן וכלה... הם מגיעים לשמח כבד וקיבה.",
            "מה ההר הכי גדול בעולם? הר הכביסה בביתנו!",
            "פלוני: 'אני לא יכול להירדם אחרי כוס קפה'. אלמוני: 'אצלי זה בדיוק הפוך, אני לא יכול לשתות קפה אחרי שאני נרדם'.",
            "לא הבנתי למה לשכנה שלי מותר לבקש ממני כוס סוכר, אבל לי אסור לבקש משולש מהפיצה שהגיעה אליה עכשיו.",
            "שלושה משוגעים רצו לברוח מבית המשוגעים. אפשרות ראשונה היא לטפס מעל הגדר, אפשרות שניה היא לחפור מנהרה מתחת לגדר. הם שלחו את אחד המשוגעים שיבדוק את השטח. המשוגע הלך לבדוק וכשחזר אמר להם שיש בעיה ואי אפשר לברוח, שאלו אותו: 'מה הבעיה?'. והוא השיב: 'אין גדר.'",
            "אין משחת שיניים שנגמרה... יש אדם שהתייאש מללחוץ.",
            "ילד אחד ביקש מאבא שלו 100 שקל. האבא אמר לו: 'כמה אתה רוצה? 50? מה תעשה עם 40? קח 30', מוציא מהארנק 20 ומביא לו 10.",
            "שלוש זקנות התווכחו מי זוכרת הכי פחות טוב. הראשונה אומרת: 'אני הולכת לשכנה לבקש משהו וכשאני מגיעה כבר שוכחת מה רציתי'. השנייה אומרת: 'אני הולכת להביא משהו מהארון ועד שאני מגיעה לארון כבר שוכחת מה רציתי'. השלישית באה לומר, אבל אז אומרת: 'שכחתי מה רציתי להגיד.'",
            "גיגי: 'אני רוצה לקנות שעון'. דידי: 'בשביל מה אתה צריך שעון?'. גיגי: 'בשביל לדעת מה השעה'. דידי: 'אתה לא צריך שעון, תשאל אנשים ברחוב'. גיגי: 'ואם ארצה לדעת מה השעה בלילה?'. דידי: 'תעשה כמוני...' דידי לקח חצוצרה ותקע בה טוטוטוטו! 'מה אתה עושה??' צעק השכן, '2 בלילה!!!'.",
            "פעם אחת... אני לא זוכרת את הבדיחה!",
            "הלכתי עכשיו למכון כושר וחזרתי גמור. לא רוצה לחשוב מה היה קורה אילו גם הייתי נכנס אליו.",
            "חיים: 'איך ישנת בלילה?'. אבי: 'כמו תינוק, כל 5 דקות קם ומתחיל לבכות.'",
            "ילד: 'אבא, למה העננים בצבע כזה?'. אבא: 'לא יודע'. ילד: 'למה המטוסים בגובה כזה?'. אבא: 'לא יודע'. ילד: 'למה הדשא בצבע כזה?'. אבא: 'לא יודע'. ילד: 'אבא, זה לא מפריע לך שאני שואל כל כך הרבה שאלות?'. אבא: 'מה פתאום בני היקר, אם לא תשאל איך תדע?'.",
            "איך קמצן עושה פן? רץ בירידה.",
            "אני יודע כל כך טוב לישון שאני עושה את זה בעיניים עצומות.",
            "אני ביישן. כשמדברים עלי - אני נעלם, אפשר להרגיש אותי, וכשמתקהלים אנשים - אני לא נמצא. כשהם הולכים - אני נמצא. מי אני? תשובה: שקט!",
            "איש אחד נכנס למסעדה והזמין שלושה בקבוקי קולה, ארבעה המבורגרים, חמישה סוגי סלטים, שבע מנות פלאפל. בא המלצר ושאל אותו: 'אתה הולך לאכול את כל זה לבד?'. ענה האיש: 'מה פתאום, אני הולך לאכול את זה עם שמונה מנות צ'יפס.'",
            "עשיתי את עצמי ישנה ובטעות נרדמתי. מחר אני הולכת לעשות את עצמי רזה...",
            "ילד: 'אמא, את אוהבת אותי?'. אמא: 'בטח!'. הילד: 'אז למה את מבשלת דברים שאני לא אוהב?'.",
            "איש אחד חלם שהוא אוכל את המרשמלו הכי גדול בעולם... בבוקר הוא גילה שאין לו כרית.",
            "זקן אחד אמר לאשתו: 'כמה שאת יפה'. האישה ענתה: 'תודה, חבל שאני לא יכולה להגיד את זה גם עליך'. הזקן: 'מה הבעיה, תעשי כמוני'. האישה: 'מה אתה עושה?'. הזקן: 'פשוט תשקרי.'",
            "היה איש אחד שכל יום היה הולך למסעדה, מזמין תה ולוקח אותו עם קרטון מתחת. יום אחד המלצר הביא לו תה בלי קרטון מתחת, אז האיש שאל: 'למה היום התה בלי ביסקוויט?'.",
            "אישה אחת באה לרב עצבנית ואמרה לו: 'בעלי לא מחכה 6 שעות בין חלבי לבשרי.' שאל הרב את בעלה: 'האם זה נכון?'. ענה לו הבעל: 'זה נכון שביקשתי ממנה קפה עם חלב אחרי שאכלתי בשרי... אבל כל דבר שאני מבקש ממנה לוקח לה 6 שעות להכין לי!'.",
            "קמצן הלך הלך הלך... נו מה, חשבתם שיזמין מונית?",
            "לכל המתלוננים על הטעם בשווארמה ובהמבורגר - לא לדאוג, זה בגלל שהעובדים שוטפים ידיים. הטעם המקורי יחזור בקרוב.",
            "בכניסה לאולם הרצאות הופיע השלט: 'ההרצאה על 'דיוק בזמן' שהייתה אמורה להיערך היום, תידחה ותיערך בעוד יומיים'."
        ];

        function getRandomJoke() {
            const randomIndex = Math.floor(Math.random() * jokes.length);
            const box = document.getElementById('joke');
            box.style.opacity = 0;
            setTimeout(() => {
                box.innerText = jokes[randomIndex];
                box.style.opacity = 1;
            }, 150);
        }

        // מנגנון הצעת ההתקנה (PWA)
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'inline-block';
        });

        async function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        }
    </script>
